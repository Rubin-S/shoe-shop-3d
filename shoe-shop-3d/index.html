<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9FA" />
    <meta name="color-scheme" content="light dark" />
    <title>AEROPRO-X LAB // 3D Interactive Sneaker Experience</title>
    
    <!-- Inline theme initializer to eliminate flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ax_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch(e) {}
      })();
    </script>
    
    <!-- Google Fonts Preconnect & Luxury Font Families -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8F9FA] dark:bg-dark-950 text-neutral-900 dark:text-white selection:bg-brand-lime selection:text-black antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
